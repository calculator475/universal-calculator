/* ============================= HELPERS ============================= */
function fmt(n, prec) {
  if (n === null || n === undefined || Number.isNaN(n)) return state.lang==='bn' ? 'অসংজ্ঞায়িত' : 'Undefined';
  if (!isFinite(n)) return n > 0 ? '∞' : '-∞';
  if (Math.abs(n) < 1e-10) n = 0;
  var p = prec || 8;
  var s = Number(n.toPrecision(p)).toString();
  return s;
}
function fmtMoney(n) {
  if (Number.isNaN(n) || !isFinite(n)) return fmt(n);
  return n.toLocaleString('en-US', {maximumFractionDigits: 2, minimumFractionDigits: 2});
}
function num(v) { var x = parseFloat(v); return x; }
function isNum(v) { return v !== '' && v !== null && v !== undefined && !Number.isNaN(parseFloat(v)) && isFinite(parseFloat(v)); }

function CalcError(bn, en) { this.bn = bn; this.en = en; this.isCalcError = true; }
function fail(bn, en) { throw new CalcError(bn, en); }

function gcdFn(a, b) { a = Math.abs(Math.round(a)); b = Math.abs(Math.round(b)); while (b) { var t = b; b = a % b; a = t; } return a; }
function lcmFn(a, b) { if (a === 0 || b === 0) return 0; return Math.abs(a * b) / gcdFn(a, b); }
function factorial(n) {
  n = Math.round(n);
  if (n < 0) return NaN;
  if (n > 170) return Infinity;
  var r = 1; for (var i = 2; i <= n; i++) r *= i; return r;
}
function nPr(n, r) { if (r > n || r < 0) return NaN; return factorial(n) / factorial(n - r); }
function nCr(n, r) { if (r > n || r < 0) return NaN; return factorial(n) / (factorial(r) * factorial(n - r)); }

function pushHistory(catId, calcName, exprText, resultText) {
  state.history.unshift({
    ts: Date.now(), cat: catId, name: calcName, expr: exprText, result: resultText
  });
  if (state.history.length > 300) state.history.length = 300;
  saveHistory();
  if (state.tab === 'history') renderView();
}

function fmtTime(ts) {
  try {
    var d = new Date(ts);
    return d.toLocaleString(state.lang==='bn' ? 'bn-BD' : 'en-US', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
  } catch(e) { return ''; }
}

/* ============================= SCIENTIFIC ENGINE ============================= */
var FUNCS = {sin:1,cos:1,tan:1,asin:1,acos:1,atan:1,sinh:1,cosh:1,tanh:1,log:1,ln:1,sqrt:1,cbrt:1,abs:1,exp:1,ncr:2,npr:2};
var CONSTS = {pi:1,e:1,ans:1};

function tokenize(expr) {
  var tokens = [];
  var s = expr.replace(/\s+/g, '');
  var i = 0;
  while (i < s.length) {
    var c = s[i];
    if (c === '×') { tokens.push({type:'op', value:'*'}); i++; continue; }
    if (c === '÷') { tokens.push({type:'op', value:'/'}); i++; continue; }
    if (c === '−') { tokens.push({type:'op', value:'-'}); i++; continue; }
    if (c === 'π') { tokens.push({type:'id', value:'pi'}); i++; continue; }
    if (c === '√') { tokens.push({type:'id', value:'sqrt'}); i++; continue; }
    if (/[0-9.]/.test(c)) {
      var numStr = c; i++;
      while (i < s.length && /[0-9.]/.test(s[i])) { numStr += s[i]; i++; }
      tokens.push({type:'num', value: parseFloat(numStr)});
      continue;
    }
    if (/[a-zA-Z]/.test(c)) {
      var id = c; i++;
      while (i < s.length && /[a-zA-Z]/.test(s[i])) { id += s[i]; i++; }
      tokens.push({type:'id', value:id});
      continue;
    }
    if ('+-*/^!(),%'.indexOf(c) !== -1) {
      tokens.push({type:'op', value:c}); i++; continue;
    }
    i++;
  }
  return tokens;
}

function insertImplicitMult(tokens) {
  var out = [];
  for (var j = 0; j < tokens.length; j++) {
    var cur = tokens[j];
    if (out.length) {
      var prev = out[out.length - 1];
      var prevEndsValue = prev.type === 'num' || (prev.type === 'op' && prev.value === ')') || prev.type === 'id';
      var curStartsValue = cur.type === 'num' || cur.type === 'id' || (cur.type === 'op' && cur.value === '(');
      var isFuncCall = prev.type === 'id' && FUNCS[prev.value.toLowerCase()] && cur.type === 'op' && cur.value === '(';
      if (prevEndsValue && curStartsValue && !isFuncCall) {
        out.push({type:'op', value:'*'});
      }
    }
    out.push(cur);
  }
  return out;
}

function toRad(x) { return state.angleMode === 'deg' ? x * Math.PI / 180 : x; }
function toDegOut(x) { return state.angleMode === 'deg' ? x * 180 / Math.PI : x; }

function callFunc(name, args) {
  var a = args[0];
  switch (name) {
    case 'sin': return Math.sin(toRad(a));
    case 'cos': return Math.cos(toRad(a));
    case 'tan': return Math.tan(toRad(a));
    case 'asin': return toDegOut(Math.asin(a));
    case 'acos': return toDegOut(Math.acos(a));
    case 'atan': return toDegOut(Math.atan(a));
    case 'sinh': return Math.sinh(a);
    case 'cosh': return Math.cosh(a);
    case 'tanh': return Math.tanh(a);
    case 'log': return Math.log10(a);
    case 'ln': return Math.log(a);
    case 'sqrt': return Math.sqrt(a);
    case 'cbrt': return Math.cbrt(a);
    case 'abs': return Math.abs(a);
    case 'exp': return Math.exp(a);
    case 'ncr': return nCr(a, args[1]);
    case 'npr': return nPr(a, args[1]);
  }
  throw new Error('unknown fn');
}

function Parser(tokens) { this.t = tokens; this.p = 0; }
Parser.prototype.peek = function() { return this.t[this.p]; };
Parser.prototype.next = function() { return this.t[this.p++]; };
Parser.prototype.parseExpression = function() {
  var left = this.parseTerm();
  while (this.peek() && this.peek().type === 'op' && (this.peek().value === '+' || this.peek().value === '-')) {
    var op = this.next().value;
    var right = this.parseTerm();
    left = op === '+' ? left + right : left - right;
  }
  return left;
};
Parser.prototype.parseTerm = function() {
  var left = this.parseUnary();
  while (this.peek() && this.peek().type === 'op' && (this.peek().value === '*' || this.peek().value === '/' || this.peek().value === '%')) {
    var op = this.next().value;
    var right = this.parseUnary();
    if (op === '*') left *= right; else if (op === '/') left /= right; else left = left % right;
  }
  return left;
};
Parser.prototype.parseUnary = function() {
  if (this.peek() && this.peek().type === 'op' && this.peek().value === '-') { this.next(); return -this.parseUnary(); }
  if (this.peek() && this.peek().type === 'op' && this.peek().value === '+') { this.next(); return this.parseUnary(); }
  return this.parsePower();
};
Parser.prototype.parsePower = function() {
  var base = this.parsePostfix();
  if (this.peek() && this.peek().type === 'op' && this.peek().value === '^') {
    this.next();
    var exp = this.parseUnary();
    base = Math.pow(base, exp);
  }
  return base;
};
Parser.prototype.parsePostfix = function() {
  var val = this.parsePrimary();
  while (this.peek() && this.peek().type === 'op' && this.peek().value === '!') {
    this.next(); val = factorial(val);
  }
  return val;
};
Parser.prototype.parsePrimary = function() {
  var t = this.peek();
  if (!t) throw new Error('unexpected end');
  if (t.type === 'num') { this.next(); return t.value; }
  if (t.type === 'op' && t.value === '(') {
    this.next();
    var val = this.parseExpression();
    if (this.peek() && this.peek().value === ')') this.next();
    return val;
  }
  if (t.type === 'id') {
    this.next();
    var name = t.value.toLowerCase();
    if (this.peek() && this.peek().type === 'op' && this.peek().value === '(') {
      this.next();
      var args = [this.parseExpression()];
      while (this.peek() && this.peek().value === ',') { this.next(); args.push(this.parseExpression()); }
      if (this.peek() && this.peek().value === ')') this.next();
      return callFunc(name, args);
    }
    if (name === 'pi') return Math.PI;
    if (name === 'e') return Math.E;
    if (name === 'ans') return state.ans;
    throw new Error('unknown id ' + name);
  }
  throw new Error('unexpected token');
};

function evalExpr(expr) {
  if (!expr || !expr.trim()) return {error: true};
  try {
    var tokens = insertImplicitMult(tokenize(expr));
    var p = new Parser(tokens);
    var val = p.parseExpression();
    if (typeof val !== 'number' || Number.isNaN(val)) return {error: true};
    return {value: val};
  } catch (e) {
    return {error: true};
  }
}

function bindSci() {
  updateSciModeChips();
  var grid = document.getElementById('sciGrid');
  grid.innerHTML = '';
  sciFunctionRows().forEach(function(row) {
    row.forEach(function(btn) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = btn.label;
      if (btn.cls) b.className = btn.cls;
      if (btn.type === 'ins' && !btn.cls) b.className = 'fn';
      b.addEventListener('click', function() { handleSciBtn(btn); });
      grid.appendChild(b);
    });
  });
  var keypad = document.getElementById('sciKeypad');
  keypad.innerHTML = '';
  sciKeypadRows().forEach(function(row) {
    row.forEach(function(btn) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = btn.label;
      if (btn.cls) b.className = btn.cls;
      b.addEventListener('click', function() { handleSciBtn(btn); });
      keypad.appendChild(b);
    });
  });
  document.getElementById('chipDeg').addEventListener('click', function(){ state.angleMode='deg'; updateSciModeChips(); });
  document.getElementById('chipRad').addEventListener('click', function(){ state.angleMode='rad'; updateSciModeChips(); });
  document.getElementById('chipInv').addEventListener('click', function(){ state.inv = !state.inv; bindSci(); });
  document.getElementById('chipCopy').addEventListener('click', function() {
    var btn = this;
    var text = state.sciExpr === '' ? '0' : state.sciExpr;
    copyText(text, function() {
      var original = '📋 ' + (state.lang==='bn'?'কপি':'Copy');
      btn.textContent = '✓ ' + (state.lang==='bn'?'কপি হয়েছে':'Copied');
      setTimeout(function(){ btn.textContent = original; }, 1400);
    });
  });
  updateSciDisplay();
}

function updateSciModeChips() {
  var d = document.getElementById('chipDeg'), r = document.getElementById('chipRad'), inv = document.getElementById('chipInv');
  if (!d) return;
  d.classList.toggle('on', state.angleMode === 'deg');
  r.classList.toggle('on', state.angleMode === 'rad');
  inv.classList.toggle('on', state.inv);
  document.getElementById('memVal').textContent = fmt(state.memory, 6);
}

function handleSciBtn(btn) {
  if (btn.type === 'ac') { state.sciExpr = ''; state.justEvaluated = false; updateSciDisplay(); return; }
  if (btn.type === 'del') {
    state.sciExpr = state.sciExpr.slice(0, -1);
    state.justEvaluated = false;
    updateSciDisplay();
    return;
  }
  if (btn.type === 'neg') {
    if (!state.sciExpr) return;
    if (/^-\(.*\)$/.test(state.sciExpr)) state.sciExpr = state.sciExpr.slice(2, -1);
    else state.sciExpr = '-(' + state.sciExpr + ')';
    state.justEvaluated = false;
    updateSciDisplay();
    return;
  }
  if (btn.type === 'mem') {
    var evalNow = evalExpr(state.sciExpr);
    var cur = evalNow.error ? state.ans : evalNow.value;
    if (btn.act === 'MC') state.memory = 0;
    else if (btn.act === 'MR') { state.sciExpr += fmt(state.memory, 10); state.justEvaluated = false; }
    else if (btn.act === 'M+') state.memory += cur;
    else if (btn.act === 'M-') state.memory -= cur;
    updateSciDisplay();
    return;
  }
  if (btn.type === 'eq') {
    var r = evalExpr(state.sciExpr);
    if (r.error) {
      document.getElementById('sciExprEl').textContent = state.lang === 'bn' ? 'ত্রুটি' : 'Error';
      return;
    }
    state.ans = r.value;
    var exprBefore = state.sciExpr;
    state.sciExpr = fmt(r.value, 10);
    state.justEvaluated = true;
    updateSciDisplay();
    pushHistory('sci', state.lang==='bn' ? 'বৈজ্ঞানিক' : 'Scientific', exprBefore + ' =', fmt(r.value, 10));
    return;
  }
  if (btn.type === 'ins') {
    var isDigit = /^[0-9.]$/.test(btn.text);
    if (state.justEvaluated) {
      if (isDigit) state.sciExpr = '';
      state.justEvaluated = false;
    }
    state.sciExpr += btn.text;
    updateSciDisplay();
  }
}

function updateSciDisplay() {
  var exprEl = document.getElementById('sciExprEl');
  var prevEl = document.getElementById('sciPreview');
  if (!exprEl) return;
  exprEl.textContent = state.sciExpr === '' ? '0' : state.sciExpr;
  var r = evalExpr(state.sciExpr);
  if (!r.error && state.sciExpr.trim() !== '' && fmt(r.value,10) !== state.sciExpr) {
    prevEl.textContent = '= ' + fmt(r.value, 10);
  } else {
    prevEl.innerHTML = '&nbsp;';
  }
  var mv = document.getElementById('memVal'); if (mv) mv.textContent = fmt(state.memory, 6);
}

var UNIT_CATS = {
  length: {
    name: {bn:'দৈর্ঘ্য', en:'Length'}, base: 'm',

var convState = {cat:'length', from:'', to:''};

function toKelvin(v,u){ if(u==='c') return v+273.15; if(u==='f') return (v-32)*5/9+273.15; return v; }
function fromKelvin(k,u){ if(u==='c') return k-273.15; if(u==='f') return (k-273.15)*9/5+32; return k; }

function renderConverter() {
  var h = viewHeader('convert');
  h += '<select class="conv-cat-select" id="convCat">';
  Object.keys(UNIT_CATS).forEach(function(key) {
    h += '<option value="' + key + '"' + (key===convState.cat?' selected':'') + '>' + L(UNIT_CATS[key].name) + '</option>';
  });
  h += '</select>';
  h += '<div class="conv-row">';
  h += '  <div class="conv-col"><label>' + L(UI.from) + '</label><select id="convFrom"></select></div>';
  h += '  <button class="conv-swap" id="convSwap" type="button" aria-label="swap">⇄</button>';
  h += '  <div class="conv-col"><label>' + L(UI.to) + '</label><select id="convTo"></select></div>';
  h += '</div>';
  h += '<div class="conv-row">';
  h += '  <div class="conv-col"><label>' + (state.lang==='bn'?'মান':'Value') + '</label><input type="number" inputmode="decimal" id="convVal" value="1"></div>';
  h += '</div>';
  h += '<div class="conv-result" id="convResult">—</div>';
  return h;
}

function populateConvUnitSelects() {
  var cat = UNIT_CATS[convState.cat];
  var keys = Object.keys(cat.units);
  if (!convState.from || !cat.units[convState.from]) convState.from = keys[0];
  if (!convState.to || !cat.units[convState.to]) convState.to = keys[1] || keys[0];
  var fromSel = document.getElementById('convFrom'), toSel = document.getElementById('convTo');
  fromSel.innerHTML = ''; toSel.innerHTML = '';
  keys.forEach(function(k) {
    var o1 = document.createElement('option'); o1.value = k; o1.textContent = L(cat.units[k].n); if (k===convState.from) o1.selected = true;
    fromSel.appendChild(o1);
    var o2 = document.createElement('option'); o2.value = k; o2.textContent = L(cat.units[k].n); if (k===convState.to) o2.selected = true;
    toSel.appendChild(o2);
  });
}

function computeConversion() {
  var cat = UNIT_CATS[convState.cat];
  var valEl = document.getElementById('convVal');
  var v = parseFloat(valEl.value);
  var resEl = document.getElementById('convResult');
  if (!isNum(valEl.value)) { resEl.textContent = L(UI.invalidInput); return; }
  var result;
  if (convState.cat === 'temperature') {
    result = fromKelvin(toKelvin(v, convState.from), convState.to);
  } else {
    var base = v * cat.units[convState.from].f;
    result = base / cat.units[convState.to].f;
  }
  resEl.textContent = fmt(v, 8) + ' ' + L(cat.units[convState.from].n) + '  =  ' + fmt(result, 8) + ' ' + L(cat.units[convState.to].n);
  var summary = fmt(v,8) + ' ' + convState.from + ' = ' + fmt(result,8) + ' ' + convState.to;
  return summary;
}

function bindConverter() {
  populateConvUnitSelects();
  computeConversion();
  document.getElementById('convCat').addEventListener('change', function(e) {
    convState.cat = e.target.value; convState.from = ''; convState.to = '';
    populateConvUnitSelects(); computeConversion();
  });
  document.getElementById('convFrom').addEventListener('change', function(e){ convState.from = e.target.value; computeConversion(); });
  document.getElementById('convTo').addEventListener('change', function(e){ convState.to = e.target.value; computeConversion(); });
  document.getElementById('convSwap').addEventListener('click', function() {
    var t = convState.from; convState.from = convState.to; convState.to = t;
    populateConvUnitSelects(); computeConversion();
  });
  var valEl = document.getElementById('convVal');
  var lastLogged = null;
  valEl.addEventListener('input', function(){ computeConversion(); });
  valEl.addEventListener('change', function() {
    var summary = computeConversion();
    if (summary && summary !== lastLogged) {
      lastLogged = summary;
      pushHistory('convert', L(UNIT_CATS[convState.cat].name), summary, '');
    }
  });
  ['convFrom','convTo','convCat'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', function() {
      var summary = computeConversion();
      if (summary) pushHistory('convert', L(UNIT_CATS[convState.cat].name), summary, '');
    });
  });
}

/* ---- chemical formula parser (handles nested parentheses, e.g. Ca(OH)2, Al2(SO4)3) ---- */
function parseFormula(str) {
  str = (str || '').replace(/\s+/g, '');
  if (!str) return {error: 'empty'};
  var i = 0;
  function parseNumber() {
    var start = i;
    while (i < str.length && /[0-9]/.test(str[i])) i++;
    if (i === start) return 1;
    return parseInt(str.slice(start, i), 10);
  }
  function parseGroup() {
    var counts = {};
    while (i < str.length && str[i] !== ')') {
      if (str[i] === '(') {
        i++;
        var sub = parseGroup();
        if (i < str.length && str[i] === ')') i++; else throw new Error('paren');
        var mult = parseNumber();
        Object.keys(sub).forEach(function(k) { counts[k] = (counts[k] || 0) + sub[k] * mult; });
      } else if (/[A-Z]/.test(str[i])) {
        var two = str.slice(i, i + 2);
        var sym;
        if (two.length === 2 && /[a-z]/.test(two[1]) && PT_BY_SYMBOL[two]) { sym = two; i += 2; }
        else if (PT_BY_SYMBOL[str[i]]) { sym = str[i]; i += 1; }
        else throw new Error('unknown element: ' + str[i]);
        var n = parseNumber();
        counts[sym] = (counts[sym] || 0) + n;
      } else {
        throw new Error('unexpected char: ' + str[i]);
      }
    }
    return counts;
  }
  try {
    var counts = parseGroup();
    if (i !== str.length) return {error: 'trailing'};
    var totalMass = 0;
    var rows = Object.keys(counts).map(function(sym) {
      var el = PT_BY_SYMBOL[sym];
      var subtotal = el.mass * counts[sym];
      totalMass += subtotal;
      return {sym: sym, count: counts[sym], mass: el.mass, subtotal: subtotal, el: el};
    });
    return {counts: counts, rows: rows, totalMass: totalMass};
  } catch (e) {
    return {error: e.message};
  }
}

function field(id, labelBn, labelEn, type, extra) {
  var f = {id:id, label:{bn:labelBn, en:labelEn}, type:type || 'number'};
  if (extra) Object.assign(f, extra);
  return f;
}
function line(labelBn, labelEn, value) { return {label:{bn:labelBn, en:labelEn}, value:value}; }

/* ============================= RENDER: CATEGORY CALCS ============================= */
function renderField(calcId, f) {
  var idAttr = calcId + '__' + f.id;
  var h = '<div class="field">';
  h += '<label for="'+idAttr+'">'+L(f.label)+'</label>';
  if (f.type === 'select') {
    h += '<select id="'+idAttr+'">';
    f.options.forEach(function(o){ h += '<option value="'+o.v+'">'+L(o.l)+'</option>'; });
    h += '</select>';
  } else if (f.type === 'date') {
    h += '<input type="date" id="'+idAttr+'">';
  } else if (f.type === 'list') {
    h += '<textarea id="'+idAttr+'" placeholder="'+(state.lang==='bn'?'যেমন: 4, 8, 6, 5, 3':'e.g. 4, 8, 6, 5, 3')+'"></textarea>';
  } else {
    h += '<input type="number" inputmode="decimal" id="'+idAttr+'" placeholder="0">';
  }
  h += '</div>';
  return h;
}

function renderPtRow(el) {
  var h = '<div class="pt-row">';
  h += '<span class="pt-z">' + el.z + '</span>';
  h += '<span class="pt-sym" style="--cat-color:var(--cat-' + el.cat + ')">' + el.sym + '</span>';
  h += '<span class="pt-names"><span class="pt-name-bn">' + el.bn + '</span><br><span class="pt-name-en">' + el.en + '</span></span>';
  h += '<span class="pt-mass">' + fmt(el.mass, 6) + '</span>';
  h += '</div>';
  return h;

function ptFilter(q) {
  q = q.trim().toLowerCase();
  if (!q) return PERIODIC_TABLE;
  return PERIODIC_TABLE.filter(function(el) {
    return el.sym.toLowerCase().indexOf(q) !== -1 ||
      el.en.toLowerCase().indexOf(q) !== -1 ||
      el.bn.indexOf(q) !== -1 ||
      String(el.z) === q;
  });
}

function renderCmResult(formula) {
  var box = document.getElementById('cmResult');
  var r = parseFormula(formula);
  if (r.error || !r.rows || !r.rows.length) {
    box.innerHTML = '<div class="result-err">⚠ ' + L(UI2.cmInvalid) + '</div>';
    box.hidden = false;
    return null;
  }
  var h = '<table class="compound-breakdown"><thead><tr>';
  h += '<th>' + L(UI2.element) + '</th><th>' + L(UI2.count) + '</th><th>' + L(UI2.atomicMass) + '</th><th>' + L(UI2.subtotal) + '</th>';
  h += '</tr></thead><tbody>';
  r.rows.forEach(function(row) {
    h += '<tr><td>' + row.sym + ' (' + (state.lang==='bn'?row.el.bn:row.el.en) + ')</td><td class="num">' + row.count + '</td><td class="num">' + fmt(row.mass,6) + '</td><td class="num">' + fmt(row.subtotal,6) + '</td></tr>';
  });
  h += '</tbody></table>';
  h += '<div class="compound-total">' + L(UI2.molarMass) + ': ' + fmt(r.totalMass, 8) + ' g/mol</div>';
  var copyLabel = '📋 ' + (state.lang==='bn'?'কপি':'Copy');
  h += '<button class="copy-btn" type="button" data-label="' + copyLabel + '">' + copyLabel + '</button>';
  box.innerHTML = h;
  box.hidden = false;
  attachCopyButton(box, function() { return L(UI2.molarMass) + ': ' + fmt(r.totalMass, 8) + ' g/mol'; });
  return r;
}

/* ============================= UNIFIED CATEGORY VIEW: ONE BOX, A PICKER, A LIVE STAGE ============================= */
function itemsFor(catId) {
  var items = (CALCS[catId] || []).map(function(c) { return Object.assign({kind:'calc'}, c); });
  if (catId === 'chemistry') {
    items = [
      {kind:'periodic', id:'pt-lookup', accent:'var(--c-chem)', name:UI2.ptTitle, desc:UI2.ptDesc},
      {kind:'compound', id:'compound-calc', accent:'var(--c-chem)', name:UI2.cmTitle, desc:UI2.cmDesc},
      {kind:'compoundRef', id:'common-compounds', accent:'var(--c-chem)', name:UI2.crTitle, desc:UI2.crDesc}
    ].concat(items);
  }
  return items;
}

function renderStage(catId, item) {
  var h = '<p class="stage-desc">' + L(item.desc) + '</p>';
  if (item.kind === 'calc') {
    h += '<div class="field-grid' + (item.fields.length <= 1 ? ' single' : '') + '">';
    item.fields.forEach(function(f) { h += renderField(item.id, f); });
    h += '</div>';
    h += '<div class="calc-actions">';
    h += '<button class="btn-calc" type="button" data-calc="' + item.id + '" style="--accent:' + item.accent + '">' + L(UI.calculate) + '</button>';
    h += '<button class="btn-clear-panel" type="button" data-clear="' + item.id + '">' + L(UI.clear) + '</button>';
    h += '</div>';
    h += '<div class="result-box" id="res__' + item.id + '" hidden></div>';
  } else if (item.kind === 'periodic') {
    h += '<input class="pt-search" id="ptSearch" type="text" placeholder="' + L(UI2.ptPlaceholder) + '">';
    h += '<div class="pt-legend">';
    Object.keys(CAT_LABELS).forEach(function(k) { h += '<span><i style="background:var(--cat-' + k + ')"></i>' + L(CAT_LABELS[k]) + '</span>'; });
    h += '</div>';
    h += '<div class="pt-list" id="ptList"></div>';
  } else if (item.kind === 'compound') {
    h += '<div class="field-grid single"><div class="field"><input type="text" id="cmFormula" placeholder="' + L(UI2.cmPlaceholder) + '"></div></div>';
    h += '<div class="calc-actions">';
    h += '<button class="btn-calc" type="button" id="cmCalcBtn" style="--accent:' + item.accent + '">' + L(UI.calculate) + '</button>';
    h += '<button class="btn-clear-panel" type="button" id="cmClearBtn">' + L(UI.clear) + '</button>';
    h += '</div>';
    h += '<div class="result-box" id="cmResult" hidden></div>';
  } else if (item.kind === 'compoundRef') {
    h += '<input class="pt-search" id="crSearch" type="text" placeholder="' + L(UI2.crSearchPh) + '">';
    h += '<div class="pt-list" id="crList"></div>';
  }
  return h;
}

function bindStage(catId, item) {
  if (item.kind === 'calc') {
    var btn = document.querySelector('[data-calc="' + item.id + '"]');
    var clearBtn = document.querySelector('[data-clear="' + item.id + '"]');
    btn.addEventListener('click', function() { runCalc(catId, item); });
    clearBtn.addEventListener('click', function() {
      item.fields.forEach(function(f) {
        var el = document.getElementById(item.id + '__' + f.id);
        if (el) el.value = '';
      });
      var box = document.getElementById('res__' + item.id);
      box.hidden = true; box.innerHTML = '';
    });
  } else if (item.kind === 'periodic') {
    var ptListEl = document.getElementById('ptList');
    function renderPtList(q) {
      var results = ptFilter(q || '');
      ptListEl.innerHTML = results.length ? results.map(renderPtRow).join('') : '<div class="pt-empty">' + L(UI2.ptNoResult) + '</div>';
    }
    renderPtList('');
    document.getElementById('ptSearch').addEventListener('input', function(e) { renderPtList(e.target.value); });
  } else if (item.kind === 'compound') {
    document.getElementById('cmCalcBtn').addEventListener('click', function() {
      var formula = document.getElementById('cmFormula').value;
      var r = renderCmResult(formula);
      if (r) pushHistory('chemistry', L(UI2.cmTitle), formula, fmt(r.totalMass, 8) + ' g/mol');
    });
    document.getElementById('cmClearBtn').addEventListener('click', function() {
      document.getElementById('cmFormula').value = '';
      var box = document.getElementById('cmResult');
      box.hidden = true; box.innerHTML = '';
    });
  } else if (item.kind === 'compoundRef') {
    var crListEl = document.getElementById('crList');
    function renderCrList(q) {
      q = (q || '').trim().toLowerCase();
      var results = COMPOUNDS.filter(function(c) {
        if (!q) return true;
        return c.f.toLowerCase().indexOf(q) !== -1 || c.bn.indexOf(q) !== -1 || c.en.toLowerCase().indexOf(q) !== -1;
      });
      crListEl.innerHTML = results.length ? results.map(function(c) {
        return '<div class="compound-item" data-formula="' + c.f + '">' +
          '<span><span class="compound-formula">' + c.f + '</span> — ' + (state.lang==='bn'?c.bn:c.en) + '</span>' +
          '<span class="compound-mass">' + fmt(c.mass, 6) + ' g/mol</span>' +
          '</div>';
      }).join('') : '<div class="pt-empty">' + L(UI2.ptNoResult) + '</div>';
      crListEl.querySelectorAll('.compound-item').forEach(function(row) {
        row.addEventListener('click', function() {
          var f = row.getAttribute('data-formula');
          switchCalcItem(catId, 'compound-calc', function() {
            document.getElementById('cmFormula').value = f;
            var r = renderCmResult(f);
            if (r) {
              var c = COMPOUNDS.filter(function(x) { return x.f === f; })[0];
              pushHistory('chemistry', L(UI2.cmTitle), f + (c ? ' (' + (state.lang==='bn'?c.bn:c.en) + ')' : ''), fmt(r.totalMass, 8) + ' g/mol');
            }
          });
        });
      });
    }
    renderCrList('');
    document.getElementById('crSearch').addEventListener('input', function(e) { renderCrList(e.target.value); });
  }
}

function switchCalcItem(catId, id, afterCb) {
  var items = itemsFor(catId);
  var item = items.filter(function(it) { return it.id === id; })[0];
  if (!item) return;
  state.selectedCalc[catId] = id;
  var picker = document.getElementById('picker__' + catId);
  if (picker) picker.value = id;
  var box = document.getElementById('singleBox__' + catId);
  if (box) box.style.setProperty('--accent', item.accent);
  var stage = document.getElementById('stage__' + catId);
  stage.innerHTML = renderStage(catId, item);
  bindStage(catId, item);
  if (afterCb) afterCb(item);
}

function renderCategory(catId) {
  var items = itemsFor(catId);
  var h = viewHeader(catId);
  var selId = state.selectedCalc[catId];
  if (!selId || !items.some(function(it) { return it.id === selId; })) selId = items[0].id;
  state.selectedCalc[catId] = selId;
  var selItem = items.filter(function(it) { return it.id === selId; })[0];
  h += '<div class="calc-panel calc-single" id="singleBox__' + catId + '" style="--accent:' + selItem.accent + '">';
  h += '<span class="picker-label">' + L(UI2.pickLabel) + '</span>';
  h += '<select class="calc-picker" id="picker__' + catId + '">';
  items.forEach(function(it) { h += '<option value="' + it.id + '"' + (it.id === selId ? ' selected' : '') + '>' + L(it.name) + '</option>'; });
  h += '</select>';
  h += '<div class="calc-stage" id="stage__' + catId + '">' + renderStage(catId, selItem) + '</div>';
  h += '</div>';
  return h;
}

function bindCategory(catId) {
  var items = itemsFor(catId);
  var selId = state.selectedCalc[catId] || items[0].id;
  var selItem = items.filter(function(it) { return it.id === selId; })[0] || items[0];
  bindStage(catId, selItem);
  document.getElementById('picker__' + catId).addEventListener('change', function(e) {
    switchCalcItem(catId, e.target.value);
  });
}

function runCalc(catId, c) {
  var values = {};
  c.fields.forEach(function(f) {
    var el = document.getElementById(c.id+'__'+f.id);
    values[f.id] = el ? el.value : '';
  });
  var box = document.getElementById('res__'+c.id);
  try {
    var lines = c.compute(values);
    var h = '';
    lines.forEach(function(ln){ h += '<div class="result-line"><span class="rlabel">'+L(ln.label)+'</span><span class="rval">'+ln.value+'</span></div>'; });
    var copyLabel = '📋 ' + (state.lang==='bn'?'কপি':'Copy');
    h += '<button class="copy-btn" type="button" data-label="' + copyLabel + '">' + copyLabel + '</button>';
    box.innerHTML = h;
    box.hidden = false;
    var summary = c.fields.map(function(f){ return L(f.label)+'='+values[f.id]; }).join(', ');
    var resultSummary = lines.map(function(ln){ return L(ln.label)+': '+ln.value; }).join(' · ');
    attachCopyButton(box, function() { return resultSummary; });
    pushHistory(catId, L(c.name), summary, resultSummary);
  } catch (e) {
    var msg = e && e.isCalcError ? (state.lang==='bn'?e.bn:e.en) : L(UI.invalidInput);
    box.innerHTML = '<div class="result-err">⚠ ' + msg + '</div>';
    box.hidden = false;
  }
}

/* ============================= HISTORY ============================= */
function renderHistory() {
  var h = viewHeader('history');
  h += '<div class="hist-toolbar"><button class="hist-clear" id="histClearBtn" type="button">'+L(UI.clearHistory)+'</button></div>';
  h += '<div id="histList">';
  if (!state.history.length) {
    h += '<div class="hist-empty">'+L(UI.noHistory)+'</div>';
  } else {
    state.history.forEach(function(item, idx) {
      var t = TABS.filter(function(x){return x.id===item.cat;})[0];
      var color = t ? t.color : 'var(--c-history)';
      h += '<div class="hist-item">';
      h += '<span class="hist-dot" style="background:'+color+'"></span>';
      h += '<div class="hist-body">';
      h += '<div class="hist-name">'+item.name+'</div>';
      h += '<div class="hist-expr">'+item.expr+(item.result? ' → '+item.result : '')+'</div>';
      h += '<div class="hist-time">'+fmtTime(item.ts)+'</div>';
      h += '</div>';
      h += '<button class="hist-del" type="button" data-idx="'+idx+'" aria-label="'+(state.lang==='bn'?'মুছুন':'Delete')+'">✕</button>';
      h += '</div>';
    });
  }
  h += '</div>';
  return h;
}

function bindHistory() {
  var btn = document.getElementById('histClearBtn');
  if (btn) btn.addEventListener('click', function() {
    state.history = [];
    saveHistory();
    renderView();
  });
  document.querySelectorAll('.hist-del').forEach(function(delBtn) {
    delBtn.addEventListener('click', function() {
      var idx = parseInt(delBtn.getAttribute('data-idx'), 10);
      state.history.splice(idx, 1);
      saveHistory();
      renderView();
    });
  });
}

/* ============================= CLIPBOARD HELPER ============================= */
function fallbackCopy(text) {
  try {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  } catch (e) {}
}
function copyText(text, doneCb) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() { if (doneCb) doneCb(); }).catch(function() { fallbackCopy(text); if (doneCb) doneCb(); });
      return;
    }
  } catch (e) {}
  fallbackCopy(text);
  if (doneCb) doneCb();
}
function attachCopyButton(box, getText) {
  var btn = box.querySelector('.copy-btn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    copyText(getText(), function() {
      var original = btn.getAttribute('data-label');
      btn.textContent = '✓ ' + (state.lang==='bn' ? 'কপি হয়েছে' : 'Copied');
      setTimeout(function() { btn.textContent = original; }, 1400);
    });
  });
}

/* ============================= INIT ============================= */
document.getElementById('langBtn').addEventListener('click', function() {
  state.lang = state.lang === 'bn' ? 'en' : 'bn';
  document.documentElement.lang = state.lang;
  renderTabs();
  renderView();
});
document.getElementById('histBtn').addEventListener('click', function() {
  state.tab = 'history';
  renderTabs();
  renderView();
});

/* Physical keyboard support for the scientific calculator (desktop use) */
document.addEventListener('keydown', function(e) {
  if (state.tab !== 'sci') return;
  var tag = document.activeElement ? document.activeElement.tagName : '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  var key = e.key;
  if (/^[0-9.]$/.test(key)) { handleSciBtn({type:'ins', text:key}); e.preventDefault(); return; }
  if ('+-*/^!%().'.indexOf(key) !== -1) { handleSciBtn({type:'ins', text:key}); e.preventDefault(); return; }
  if (key === 'Enter' || key === '=') { handleSciBtn({type:'eq'}); e.preventDefault(); return; }
  if (key === 'Backspace') { handleSciBtn({type:'del'}); e.preventDefault(); return; }
  if (key === 'Escape') { handleSciBtn({type:'ac'}); e.preventDefault(); return; }
});

renderTabs();
renderView();
})();
</script>
